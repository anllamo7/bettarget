name: Actualizar datos
on:
  schedule: [{cron: '0 5 * * *'}, {cron: '0 13 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python build_data.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data.json && (git add players_cache.json || true) && (git commit -m "datos" && git push) || echo "sin cambios"
